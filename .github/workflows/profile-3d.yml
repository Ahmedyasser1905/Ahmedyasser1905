name: Generate 3D Profile Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate 3D contribution graph SVG
        # Using rca/profile-3d action to generate an isometric SVG of your contributions
        uses: rca/profile-3d@v1
        with:
          username: "Ahmedyasser1905"    # explicit GitHub username
          output: "profile-3d-contrib/profile-night-rainbow.svg"
          # Optional appearance inputs supported by some forks (uncomment if supported):
          # palette: "night-rainbow"
          # width: 1200
          # height: 400

      - name: Show generated file (for debug)
        run: |
          ls -la profile-3d-contrib || true
          if [ -f profile-3d-contrib/profile-night-rainbow.svg ]; then
            echo "SVG generated"
            wc -c profile-3d-contrib/profile-night-rainbow.svg
          else
            echo "SVG not found"
            exit 0
          fi

      - name: Commit and push (if changed)
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          mkdir -p profile-3d-contrib
          git add profile-3d-contrib/profile-night-rainbow.svg || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update 3D contribution graph"
            git push
          fi
